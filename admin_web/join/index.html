<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Únete a una cartera · Monchi</title>
<link rel="icon" href="/logo.png">
<style>
  /* Shown only when the phone does not have Monchi (with the app, the link opens it). */
  :root { --bg: #131B2E; --card: #1C2540; --ink: #F3F5FA; --muted: #A9B2C6; --yellow: #FFC800; --line: rgba(255,255,255,.1); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 22px; text-align: center; }
  img { width: 84px; height: 84px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 14px 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  ol { text-align: left; color: var(--muted); padding-left: 20px; margin: 0 0 20px; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 0; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; margin-top: 10px; }
  .primary { background: var(--yellow); color: #131B2E; }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  #msg { min-height: 1.5em; margin: 12px 0 0; color: var(--yellow); }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Monchi">
  <h1>Te invitaron a una cartera de Monchi</h1>
  <p id="lead">Para unirte necesitas la app Monchi en tu teléfono Android.</p>
  <ol>
    <li>Descarga e instala Monchi.</li>
    <li>Vuelve a tocar el link de la invitación: se abrirá Monchi y te unes con un toque.</li>
  </ol>
  <a class="btn primary" href="https://github.com/Roxx29/expensed_managment_AaronGuardia/releases/latest/download/ExpenseManager.apk">Descargar Monchi</a>
  <button class="btn ghost" id="copy" type="button">Copiar el código de invitación</button>
  <p id="msg" role="status"></p>
</main>
<script>
  // The code is only in the #fragment: it is never sent to this server.
  const code = (location.hash.match(/[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}/) || [])[0];
  const msg = document.getElementById('msg');
  const copy = document.getElementById('copy');
  if (!code) {
    copy.hidden = true;
    document.getElementById('lead').textContent = 'Este link está incompleto. Pide a quien te invitó que te lo envíe de nuevo.';
  }
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); msg.textContent = 'Código copiado. En Monchi: Más › Carteras › Unirse con un código.'; }
    catch { msg.textContent = code; }
  });
</script>
</body>
</html>
