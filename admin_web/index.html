<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Monchi Admin</title>
<link rel="icon" href="logo.png">
<style>
  /* Neumorphism (soft UI): every surface shares the background color and is
     shaped only by a light shadow (top-left) and a dark one (bottom-right).
     Pressed / selected / input = the same shadows inset. */
  :root {
    --bg: #E6EBF1; --ink: #1E293B; --muted: #556072; --accent: #0F766E; --on-accent: #FFFFFF;
    --bar: #0D9488; --bar-hi: #0F766E; --danger: #B42318; --line: rgba(30, 41, 59, .08);
    --hi: rgba(255, 255, 255, .9); --lo: rgba(163, 177, 198, .75);
    --raise: 7px 7px 14px var(--lo), -7px -7px 14px var(--hi);
    --raise-sm: 4px 4px 8px var(--lo), -4px -4px 8px var(--hi);
    --press: inset 4px 4px 8px var(--lo), inset -4px -4px 8px var(--hi);
    --chip-play: #166534; --chip-gift: #115E59; --chip-code: #9A3412; --chip-blocked: #991B1B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #222936; --ink: #E5EAF1; --muted: #A3AEBF; --accent: #2DD4BF; --on-accent: #0B1220;
      --bar: #19A99B; --bar-hi: #2DD4BF; --danger: #FCA5A5; --line: rgba(255, 255, 255, .06);
      --hi: rgba(52, 62, 79, .9); --lo: rgba(14, 17, 24, .85);
      --chip-play: #86EFAC; --chip-gift: #5EEAD4; --chip-code: #FDBA74; --chip-blocked: #FCA5A5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--bg); position: sticky; top: 0; z-index: 3; box-shadow: 0 6px 12px -8px var(--lo); }
  header img { width: 40px; height: 40px; border-radius: 12px; padding: 4px; box-shadow: var(--raise-sm); }
  header h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  header .who { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 12px; align-items: center; }
  nav { display: flex; gap: 10px; padding: 18px 24px 8px; overflow-x: auto; max-width: 1180px; margin: 0 auto; }
  nav button { background: var(--bg); border: 0; padding: 9px 18px; border-radius: 999px; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--raise-sm); transition: box-shadow .15s, color .15s; }
  nav button:hover { color: var(--ink); }
  nav button.on { box-shadow: var(--press); color: var(--accent); }
  .subnav { padding: 4px 0 22px; margin: 0; }
  a.btn { display: inline-block; text-decoration: none; }
  .subnav button { font-size: 14px; padding: 8px 16px; }
  main { max-width: 1180px; margin: 0 auto; padding: 12px 24px 48px; }
  .card { background: var(--bg); border-radius: 22px; padding: 20px 22px; margin-bottom: 22px; box-shadow: var(--raise); }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .section { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 26px 4px 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
  .stat { background: var(--bg); border-radius: 20px; padding: 16px 18px; box-shadow: var(--raise); min-height: 104px; }
  .stat b { display: block; font-size: 30px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px; }
  .cols > .card { margin-bottom: 0; }
  /* Column chart: thin bars on a recessive baseline, value on hover/focus. */
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 170px; padding: 22px 6px 0; border-bottom: 1px solid var(--line); position: relative; }
  .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; outline: none; cursor: default; min-width: 6px; }
  .bar i { display: block; width: 100%; max-width: 34px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar:hover i, .bar:focus i { background: var(--bar-hi); }
  .bar .v { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin-bottom: 3px; flex: none; }
  .bar i { flex: none; }
  .bar .tip { display: none; position: absolute; bottom: calc(100% + 6px); background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 8px; white-space: nowrap; z-index: 2; pointer-events: none; }
  .bar:hover .tip, .bar:focus .tip { display: block; }
  .axis { display: flex; gap: 4px; padding: 6px 6px 0; font-size: 11px; color: var(--muted); }
  .axis span { flex: 1; text-align: center; min-width: 6px; white-space: nowrap; }
  /* Horizontal bars (plans, versions): label, track, value. */
  .hbar { display: grid; grid-template-columns: 130px 1fr 52px; gap: 12px; align-items: center; margin: 10px 0; font-size: 14px; }
  .hbar .track { height: 12px; border-radius: 999px; box-shadow: var(--press); overflow: hidden; }
  .hbar .track i { display: block; height: 100%; background: var(--bar); border-radius: 999px; }
  .hbar b { text-align: right; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .scroll { overflow-x: auto; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; margin: 2px 4px 2px 0; box-shadow: var(--raise-sm); font-weight: 600; }
  .chip.play { color: var(--chip-play); } .chip.gift { color: var(--chip-gift); }
  .chip.code { color: var(--chip-code); } .chip.blocked { color: var(--chip-blocked); }
  button.btn, .btn { border: 0; background: var(--bg); color: var(--ink); padding: 8px 14px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: var(--raise-sm); transition: box-shadow .12s; }
  .btn:active { box-shadow: var(--press); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, nav button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 0; border-radius: 12px; padding: 10px 12px; box-shadow: var(--press); }
  input[type=checkbox] { box-shadow: none; width: 18px; height: 18px; accent-color: var(--accent); }
  textarea { width: 100%; min-height: 80px; }
  .muted { color: var(--muted); font-size: 13px; }
  .center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .center > div { padding: 36px 40px; border-radius: 28px; box-shadow: var(--raise); }
  .center img { width: 88px; border-radius: 22px; padding: 8px; box-shadow: var(--raise-sm); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 14px; display: none; max-width: 90vw; z-index: 5; }
  code { padding: 2px 8px; border-radius: 8px; box-shadow: var(--press); font-size: 13px; }
  @media (max-width: 640px) {
    header h1 { display: none; }
    main, nav, header { padding-left: 14px; padding-right: 14px; }
    .cols { grid-template-columns: 1fr; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .stat b { font-size: 24px; }
    .hbar { grid-template-columns: 100px 1fr 44px; }
  }
</style>
</head>
<body>
<div id="app"><div class="center"><p class="muted">Cargando…</p></div></div>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
