<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Monchi Admin</title>
<link rel="icon" href="logo.png">
<style>
  /* Bento grid: flat rounded tiles of different sizes packed in a dense grid.
     Light page, white tiles, hairline border; the first tile of each group is the
     big accent one. */
  :root {
    --bg: #F2F4F7; --card: #FFFFFF; --tile2: #E7F5F3; --ink: #14202B; --muted: #5B6776;
    --accent: #0F766E; --on-accent: #FFFFFF; --bar: #0D9488; --bar-hi: #0F766E; --danger: #B42318;
    --line: rgba(20, 32, 43, .09); --r: 24px; --gap: 14px;
    --chip-play: #166534; --chip-gift: #115E59; --chip-code: #9A3412; --chip-blocked: #991B1B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1319; --card: #171E27; --tile2: #12302D; --ink: #E7ECF2; --muted: #9AA7B8;
      --accent: #2DD4BF; --on-accent: #06201C; --bar: #19A99B; --bar-hi: #2DD4BF; --danger: #FCA5A5;
      --line: rgba(255, 255, 255, .08);
      --chip-play: #86EFAC; --chip-gift: #5EEAD4; --chip-code: #FDBA74; --chip-blocked: #FCA5A5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; max-width: 1180px; margin: 14px auto 0; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); position: sticky; top: 10px; z-index: 3; }
  header img { width: 40px; height: 40px; border-radius: 12px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  header .who { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 12px; align-items: center; }
  nav { display: flex; gap: 8px; padding: 14px 0 6px; overflow-x: auto; max-width: 1180px; margin: 0 auto; }
  nav button { background: var(--card); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  nav button:hover { color: var(--ink); }
  nav button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .subnav { padding: 4px 0 16px; margin: 0; }
  a.btn { display: inline-block; text-decoration: none; }
  .subnav button { font-size: 14px; padding: 7px 14px; }
  main { max-width: 1180px; margin: 0 auto; padding: 8px 0 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; margin-bottom: var(--gap); }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .section { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 26px 4px 12px; }
  /* Stat tiles: 4 columns, dense packing; first tile 2x2 and accent-coloured. */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(104px, auto); grid-auto-flow: dense; gap: var(--gap); }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; justify-content: flex-end; }
  .stat:nth-child(5n+4) { background: var(--tile2); }
  .stat:first-child { grid-column: span 2; grid-row: span 2; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .stat:first-child span, .stat:first-child small { color: inherit; opacity: .85; }
  .stat:first-child b { font-size: 52px; }
  .stat b { display: block; font-size: 30px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  /* Chart cards: the first one spans two columns. */
  .cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); grid-auto-flow: dense; }
  .cols > .card { margin-bottom: 0; }
  .cols > .card:first-child { grid-column: span 2; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 170px; padding: 22px 6px 0; border-bottom: 1px solid var(--line); position: relative; }
  .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; outline: none; cursor: default; min-width: 6px; }
  .bar i { display: block; width: 100%; max-width: 34px; background: var(--bar); border-radius: 6px 6px 0 0; min-height: 2px; }
  .bar:hover i, .bar:focus i { background: var(--bar-hi); }
  .bar .v { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin-bottom: 3px; flex: none; }
  .bar i { flex: none; }
  .bar .tip { display: none; position: absolute; bottom: calc(100% + 6px); background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 8px; white-space: nowrap; z-index: 2; pointer-events: none; }
  .bar:hover .tip, .bar:focus .tip { display: block; }
  .axis { display: flex; gap: 4px; padding: 6px 6px 0; font-size: 11px; color: var(--muted); }
  .axis span { flex: 1; text-align: center; min-width: 6px; white-space: nowrap; }
  .hbar { display: grid; grid-template-columns: 130px 1fr 52px; gap: 12px; align-items: center; margin: 10px 0; font-size: 14px; }
  .hbar .track { height: 12px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .hbar .track i { display: block; height: 100%; background: var(--bar); border-radius: 999px; }
  .hbar b { text-align: right; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .scroll { overflow-x: auto; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; margin: 2px 4px 2px 0; background: var(--bg); border: 1px solid var(--line); font-weight: 600; }
  .chip.play { color: var(--chip-play); } .chip.gift { color: var(--chip-gift); }
  .chip.code { color: var(--chip-code); } .chip.blocked { color: var(--chip-blocked); }
  button.btn, .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .12s; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent); opacity: .9; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, nav button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  textarea { width: 100%; min-height: 80px; }
  .muted { color: var(--muted); font-size: 13px; }
  .center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .center > div { padding: 36px 40px; border-radius: 28px; background: var(--card); border: 1px solid var(--line); }
  .center img { width: 88px; border-radius: 22px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 14px; display: none; max-width: 90vw; z-index: 5; }
  code { padding: 2px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 1200px) { header, nav, main { margin-left: 14px; margin-right: 14px; } header { max-width: none; } }
  @media (max-width: 640px) {
    header h1 { display: none; }
    .cols { grid-template-columns: 1fr; } .cols > .card:first-child { grid-column: auto; }
    .stat:first-child b { font-size: 40px; }
    .stat b { font-size: 24px; }
    .hbar { grid-template-columns: 100px 1fr 44px; }
  }
</style>
</head>
<body>
<div id="app"><div class="center"><p class="muted">Cargando…</p></div></div>
<div id="toast" role="status"></div>
<!-- ?v= changes with every panel update so phones and the domain cache never keep an old app.js. -->
<script type="module" src="app.js?v=37"></script>
</body>
</html>
