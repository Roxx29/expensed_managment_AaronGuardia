<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Monchi Admin</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --mint: #14B8A6; --mint-ink: #0F766E; --coral: #FF7A59; --danger: #EF4444; --ok: #22C55E;
    --bg: #FAFAF7; --card: #FFFFFF; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0; --chip: #F1F5F9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F172A; --card: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #263453; --chip: #1E2B47; --mint-ink: #5EEAD4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header img { width: 34px; height: 34px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 800; }
  header .who { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; }
  nav { display: flex; gap: 4px; padding: 10px 20px; overflow-x: auto; }
  nav button { background: none; border: 0; padding: 8px 14px; border-radius: 999px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
  nav button.on { background: var(--mint); color: #fff; font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 20px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .stat b { display: block; font-size: 28px; font-weight: 800; }
  .stat span { color: var(--muted); font-size: 13px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 8px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .bar i { display: block; width: 100%; max-width: 48px; background: var(--mint); border-radius: 8px 8px 2px 2px; min-height: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .scroll { overflow-x: auto; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--chip); font-size: 12px; margin: 1px 2px 1px 0; }
  .chip.play { background: #DCFCE7; color: #166534; } .chip.gift { background: #CCFBF1; color: #115E59; }
  .chip.code { background: #FFE4DA; color: #9A3412; } .chip.blocked { background: #FEE2E2; color: #991B1B; }
  button.btn, .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 12px; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn.primary { background: var(--mint); border-color: var(--mint); color: #fff; font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 70px; }
  .muted { color: var(--muted); font-size: 13px; }
  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; }
  .center img { width: 88px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; display: none; max-width: 90vw; }
  code { background: var(--chip); padding: 1px 6px; border-radius: 6px; }
  @media (max-width: 640px) { header h1 { display: none; } main, nav, header { padding-left: 12px; padding-right: 12px; } }
</style>
</head>
<body>
<div id="app"><div class="center"><p class="muted">Cargando…</p></div></div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
