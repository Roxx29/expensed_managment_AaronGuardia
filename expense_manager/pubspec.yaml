name: expense_manager
description: Offline-first personal finance app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management
  flutter_riverpod: ^3.0.0
  # Navigation
  go_router: ^18.0.2
  # Local database (SQLite)
  drift: ^2.28.0
  drift_flutter: ^0.3.1
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  # Profile photo, backup export/import
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  file_picker: 13.1.0
  cupertino_icons: ^2.0.0
  # Phase 5: encryption (PIN hash, encrypted backups), app lock, reminders
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  # Phase 6: on-device receipt text recognition (no network)
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
