# Builds the Android APK (sideload) and the App Bundle (Google Play) on every
# push to main and publishes both in GitHub Releases. Newest builds:
#   https://github.com/<user>/<repo>/releases/latest/download/ExpenseManager.apk
#   https://github.com/<user>/<repo>/releases/latest/download/Monchi.aab
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # needed only to create the release

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expense_manager
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # later steps never need the write token

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project
        run: |
          flutter --version
          test -d android || { echo "::error::The android/ folder is missing from the repository. Commit expense_manager/android."; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      # Analysis and tests are reported but never block the APK.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Tests
        continue-on-error: true
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q libsqlite3-dev >/dev/null
          flutter test

      - name: Signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::Missing signing secret for $v"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          # Upload-key fingerprints for Firebase / Google sign-in (public values).
          {
            echo '### Upload key fingerprints'
            echo '```'
            keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA256:' || echo 'keytool could not read the key'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn if unsigned
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::No signing secrets. The APK uses a temporary key, so it cannot update a previous install."

      - name: Build APK and App Bundle
        run: |
          # Debug symbols go to build/symbols (uploaded as an artifact, needed
          # only to read crash stack traces), which makes the app smaller.
          ARGS="--release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}"
          # One CPU type per APK instead of three: about a third of the size.
          # ExpenseManager.apk = 64-bit ARM (almost every phone since 2017);
          # ExpenseManager-32bit.apk for old phones. Same version code in both.
          flutter build apk $ARGS --split-debug-info=build/symbols/apk-arm64 --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk ExpenseManager.apk
          flutter build apk $ARGS --split-debug-info=build/symbols/apk-arm --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk ExpenseManager-32bit.apk
          ls -l ExpenseManager*.apk >> "$GITHUB_STEP_SUMMARY"
          # Google Play builds per-phone downloads from the bundle by itself.
          flutter build appbundle $ARGS --split-debug-info=build/symbols/aab
          cp build/app/outputs/bundle/release/app-release.aab Monchi.aab

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Monchi-builds
          path: |
            expense_manager/ExpenseManager.apk
            expense_manager/ExpenseManager-32bit.apk
            expense_manager/Monchi.aab
            expense_manager/build/symbols

      - name: Publish release
        # Branch runs (manual "Run workflow") only check the build.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monchi — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            expense_manager/ExpenseManager.apk
            expense_manager/ExpenseManager-32bit.apk
            expense_manager/Monchi.aab
          body: |
            Download **ExpenseManager.apk**, open it on your Android phone and allow "install unknown apps".
            Very old phone (32-bit) and it says "app not installed"? Use **ExpenseManager-32bit.apk**.
            **Monchi.aab** is for Google Play Console (Internal testing → Create new release → upload).
            Commit: ${{ github.sha }}
